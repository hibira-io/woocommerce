# Attaches hibira-live-visitors.zip to each published GitHub Release, ready for
# Plugins → Add New → Upload Plugin and for the Woo Marketplace. It unpacks to
# hibira-live-visitors/ whatever the version. The tag must be v<Version from
# hibira-live-visitors.php>, e.g. v0.1.0.
name: release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the plugin version
        run: |
          version="$(sed -n 's/^ \* Version: *//p' hibira-live-visitors.php)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: git archive --format=zip --prefix=hibira-live-visitors/ -o hibira-live-visitors.zip HEAD
      - run: gh release upload "$GITHUB_REF_NAME" hibira-live-visitors.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
